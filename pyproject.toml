[project]
name = "hannibal-hub-agents"
version = "0.1.0"
description = "Current lineup: Github Webhook Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jwt>=1.4.0",
    "google-genai>=2.3.0",
    "pygithub>=2.9.1",
    "pytz>=2026.2",
    "google-cloud-pubsub>=2.17.0",
    "google-cloud-logging>=3.11.0",
    "tenacity>=9.0.0",
    "uvicorn>=0.30.0",
    "google-adk>=2.4.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

