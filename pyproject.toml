[project]
name = "hannibal-hub-agents"
version = "0.1.0"
description = "Current lineup: Github Webhook Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jwt>=1.4.0",
    "google-genai>=2.3.0",
    "pygithub>=2.9.1",
    "pytz>=2026.2",
    "google-cloud-pubsub>=2.17.0",
    "google-cloud-logging>=3.11.0",
    "tenacity>=9.0.0",
    "uvicorn>=0.30.0",
    "google-adk>=2.4.0",
]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "mypy>=2.1.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
    "unit: Fast isolated unit tests with mocked dependencies.",
    "integration: Component integration tests using local worktrees or CLI tools.",
    "slow: Heavy multi-turn or resource-intensive tests.",
    "e2e: Live end-to-end tests against GitHub APIs or GCP Firestore.",
    "webhook_agent: Tests specific to the Webhook Receiver Agent.",
    "guardrails: Tests for safety plugins and security guardrails.",
    "firestore: Tests for Firestore checkpoint registries.",
    "pubsub: Tests for Pub/Sub push event handlers.",
]
filterwarnings = [
    "ignore:.*EventsCompactionConfig.*:UserWarning",
    "ignore:.*FeatureName.AGENT_CONFIG is enabled.*:UserWarning",
    "ignore:.*LoopAgent is deprecated in favor of Workflow.*:DeprecationWarning",
    "ignore:.*SequentialAgent is deprecated in favor of Workflow.*:DeprecationWarning",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    "ignore:::google.auth.transport.grpc",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "docs/**",
    "*.ipynb",
    "*.md",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",      # line length handled by formatter
    "ASYNC230",  # blocking file open in async (standard in local loaders)
    "ASYNC240",  # blocking path operations in async (standard in path checks)
    "B005",      # multi-char .strip() is intentional for markdown cleanup
    "RUF002",    # unicode punctuation in docstrings is acceptable
    "SIM102",    # nested ifs often more readable than mega-conditions
    "SIM108",    # ternary operator enforcement (if-else statements are clearer)
    "SIM117",    # nested with-statements often more readable than combined
]

[tool.ruff.lint.isort]
known-first-party = ["webhook_agent", "logic"]

[tool.ruff.lint.per-file-ignores]
".agents/**" = ["F821", "T201"]
"dev/**" = ["E402", "T201", "B008", "RUF012"]
"scripts/**" = ["T201"]
"tests/**" = ["F841", "F401", "E402", "T201", "S101"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
exclude = [
    "\\.venv/",
    "\\.agents/",
    "\\.pytest_cache/",
    "\\.ruff_cache/",
    "\\.mypy_cache/",
]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
ignore_missing_imports = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true

# --- Strict Core ---
# Force type annotations for agent modules to prevent runtime TypeErrors
[[tool.mypy.overrides]]
module = [
    "webhook_agent.*",
    "logic.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# --- Library Overrides ---
# These libraries lack type stubs or have complex C-extensions
[[tool.mypy.overrides]]
module = [
    "cryptography.*",
    "fastapi.*",
    "github.*",
    "google.*",
    "google.adk.*",
    "google.cloud.*",
    "google.genai.*",
    "httpx.*",
    "jwt.*",
    "pdfplumber.*",
    "pypdf.*",
    "pydantic.*",
    "pytest.*",
    "pytz.*",
    "tenacity.*",
    "uvicorn.*",
]
ignore_missing_imports = true
