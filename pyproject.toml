[project]
name = "hannibal-hub-agents"
version = "0.1.0"
description = "Current lineup: Github Webhook Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "pyjwt>=2.10.0",
    "google-genai>=2.3.0",
    "pygithub>=2.9.1",
    "google-cloud-pubsub>=2.17.0",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-logging>=3.11.0",
    "google-adk==2.12.0",
    "nest-asyncio>=1.6.0",
    "detect-secrets>=1.5.0",
    "bandit>=1.8.0",
    "diff-cover>=10.6.0",
]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "mypy>=2.1.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --deselect pytest.mark.integration"
norecursedirs = ["_archive", ".*", "dev", "docs"]
markers = [
    "unit: Fast isolated unit tests with mocked dependencies.",
    "integration: Component integration tests using local worktrees or CLI tools.",
    "slow: Heavy multi-turn or resource-intensive tests.",
    "e2e: Live end-to-end tests against GitHub APIs or GCP Firestore.",
    "webhook_agent: Tests specific to the Webhook Receiver Agent.",
    "guardrails: Tests for safety plugins and security guardrails.",
    "firestore: Tests for Firestore checkpoint registries.",
    "pubsub: Tests for Pub/Sub push event handlers.",
]
filterwarnings = [
    "ignore:.*EventsCompactionConfig.*:UserWarning",
    "ignore:.*FeatureName.AGENT_CONFIG is enabled.*:UserWarning",
    "ignore:.*LoopAgent is deprecated in favor of Workflow.*:DeprecationWarning",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    "ignore:::google.auth.transport.grpc",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "docs/**",
    "*.ipynb",
    "*.md",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (security)
]
ignore = [
    "E501",      # line length handled by formatter
    "ASYNC230",  # blocking file open in async (standard in local loaders)
    "ASYNC240",  # blocking path operations in async (standard in path checks)
    "B005",      # multi-char .strip() is intentional for markdown cleanup
    "RUF002",    # unicode punctuation in docstrings is acceptable
    "SIM102",    # nested ifs often more readable than mega-conditions
    "SIM108",    # ternary operator enforcement (if-else statements are clearer)
    "SIM117",    # nested with-statements often more readable than combined
]

[tool.ruff.lint.isort]
known-first-party = ["webhook_agent"]

[tool.ruff.lint.per-file-ignores]
".agents/**" = ["F821", "T201"]
"dev/**" = ["E402", "T201", "B008", "RUF012", "S603", "S607"]
"scripts/**" = ["T201"]
"tests/**" = ["F841", "F401", "E402", "T201", "S101", "S103", "S105", "S106", "S108"]

[tool.bandit]
# Bandit (standalone) uses B-codes, not ruff's S-codes. Inline `# noqa: S603`
# comments satisfy ruff but are ignored by bandit. These skips cover intentional
# / false-positive findings across the codebase:
#   B101  assert_used            — skipped in security_scanner.py command line
#   B310  urlopen                — GCE metadata endpoint (rate_limiter.py)
#   B108  insecure temp file     — /tmp/keys for GitHub App private key (processor.py)
#   B404/B603 subprocess         — subprocess execution in CLI/tool wrappers
#   B110  try/except/pass        — trial parsing of template wrappers (ast_gate.py)
#   B105  hardcoded password     — "PASS" is a CI status enum (ci_gate.py, schemas.py)
#   B311  pseudo-random          — non-cryptographic jitter for backoff (worker.py, circuit_breaker.py)
skips = [
    "B101",
    "B310",
    "B108",
    "B404",
    "B603",
    "B110",
    "B105",
    "B311",
]
exclude_dirs = [
    ".venv",
    ".agents",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "docs",
    "dev",
    "scripts",
    "tests",
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
exclude = [
    "\\.venv/",
    "\\.agents/",
    "\\.pytest_cache/",
    "\\.ruff_cache/",
    "\\.mypy_cache/",
]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
ignore_missing_imports = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true

# --- Strict Core ---
# Force type annotations for agent modules to prevent runtime TypeErrors
[[tool.mypy.overrides]]
module = [
    "webhook_agent.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_errors = true

# --- Library Overrides ---
# These libraries lack type stubs or have complex C-extensions
[[tool.mypy.overrides]]
module = [
    "google.adk.*",
    "google.cloud.*",
    "nest_asyncio.*",
    "detect_secrets.*",
    "bandit.*",
    "diff_cover.*",
]
ignore_missing_imports = true

