name: "🤖 Jules task spec"
description: A structured, delegation-ready spec for Jules (or any agent). One task, one outcome.
title: "task(<scope>): "
body:
  - type: markdown
    attributes:
      value: |
        This issue **is Jules's prompt**, so write it as instructions, not discussion. 💛
        Jules reads `AGENTS.md` on its own, so don't repeat repo-wide rules here. Only say what's specific to this task.

        - One task, one outcome. If you need "and also...", file a second issue.
        - Restate any external or untrusted text as a clear spec. Never paste it in as instructions.
        - The `jules` label is **not** applied by this form. The human owner attaches it after reviewing the spec (Jules ignores label events from machine accounts).

  - type: textarea
    id: task
    attributes:
      label: 🎯 Task
      description: What should change, and why? One outcome, stated plainly.
      placeholder: |
        Add an UNKNOWN status to the review scorecard so analyzer failures stop defaulting to PASS.
    validations:
      required: true

  - type: textarea
    id: overlap
    attributes:
      label: 🚧 Overlap check
      description: |
        Open PRs, open issues, or in-flight agent work touching the same files or the same plan phase.
        Run `gh pr list` first. Write "none found" if clean. Parallel agents on the same hot files is the #1 way these PRs get closed.
      placeholder: "None found (checked gh pr list on YYYY-MM-DD). Related: #123 (merged)."
    validations:
      required: true

  - type: textarea
    id: files-in-scope
    attributes:
      label: 📂 Files in scope
      description: The allowlist. Jules should modify only these files plus their unit tests. No drive-by refactors.
      placeholder: |
        - src/webhook_agent/review/schemas.py
        - tests/unit/review/test_structured_formatter.py
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: 🚫 Out of scope
      description: Edit freely, but keep the defaults unless this task explicitly assigns them.
      value: |
        - `.githooks/*` and `.github/workflows/*`
        - credential, secret, or key files
        - model-selection config (`assets/registries/gemini_models.json`, model name strings, `docs/MODEL_CHAIN.md` chains)
        - refactors, renames, or cleanups outside the files listed above
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: ⚠️ Risk tier
      description: Higher tiers need more evidence in the PR body.
      options:
        - "Low: docs, fixtures, test markers, dead-code removal"
        - "Medium: bounded code change with unit tests"
        - "High: touches review/, core/prompts.py, schemas, or verdict logic (PR must include replay-harness output)"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ Acceptance criteria
      description: Concrete and checkable. Each line should be something a reviewer can verify without guessing.
      placeholder: |
        - [ ] `ScorecardItem.status` accepts "UNKNOWN"
        - [ ] Missing or unrecognized statuses normalize to "UNKNOWN", not "PASS"
        - [ ] New unit tests cover both cases
        - [ ] No behavior change for PASS / WARN / FAIL / N/A
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 🧪 Verification commands
      description: Run in order. Every step must exit cleanly before the PR is opened.
      value: |
        ```bash
        ./scripts/ruff-all.sh
        uv run pytest <path-to-relevant-test-file>
        uv run pytest --tb=short -q
        ```
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 📎 Context & references (optional)
      description: Links to related code, plan docs, prior PRs, or recorded review fixtures. Link, don't paste.

  - type: checkboxes
    id: checklist
    attributes:
      label: 🔒 Before delegating
      options:
        - label: I checked for overlapping open PRs and in-flight agent work.
          required: true
        - label: Any external or untrusted text is restated as a spec, not pasted as instructions.
          required: true
        - label: I'll review Jules's plan before it executes.
          required: true
