name: Hannibal Webhook Agent Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Auth to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: 'projects/1023782330414/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'webhook-agent-sa@cgj8702-webhook-agent.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Persistent SSH Key
        env:
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$GCP_SSH_PRIVATE_KEY" > ~/.ssh/google_compute_engine
          chmod 600 ~/.ssh/google_compute_engine
          ssh-keygen -y -f ~/.ssh/google_compute_engine > ~/.ssh/google_compute_engine.pub

      - name: VM Deploy via IAP
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gcloud compute ssh carly@hannibal-hub-free \
            --project=chatbot-project-hannibal \
            --zone=us-east1-d \
            --tunnel-through-iap \
            --quiet \
            --command="
              set -e
              cd /home/carly/hannibal-hub-agents

              cleanup() {
                git remote set-url origin https://github.com/cgj8702-org/hannibal-hub-agents.git 2>/dev/null || true
              }
              trap cleanup EXIT

              # Authenticate, fetch, then immediately scrub token from git config
              git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/cgj8702-org/hannibal-hub-agents.git
              git fetch --quiet origin
              cleanup

              git checkout --quiet main
              git reset --quiet --hard origin/main
              git clean -fd --quiet

              uv sync --no-dev --frozen

              mkdir -p ~/.config/systemd/user
              cp scripts/hannibal-webhook-agent.service ~/.config/systemd/user/
              loginctl enable-linger \$(id -u -n) || true
              export XDG_RUNTIME_DIR=/run/user/\$(id -u)
              systemctl --user daemon-reload
              systemctl --user enable hannibal-webhook-agent
              systemctl --user restart hannibal-webhook-agent

              # Verify service actually started and is healthy
              sleep 15
              ACTIVE=\$(systemctl --user is-active hannibal-webhook-agent || true)
              RESTARTS=\$(systemctl --user show -p NRestarts --value hannibal-webhook-agent || true)
              if [ \"\$ACTIVE\" = 'active' ] && [ \"\$RESTARTS\" = '0' ]; then
                echo 'Deployment Complete. Service is active with 0 restarts.'
              else
                echo \"ERROR: Service check failed (active=\$ACTIVE, restarts=\$RESTARTS)!\"
                systemctl --user status hannibal-webhook-agent --no-pager || true
                journalctl --user -u hannibal-webhook-agent --no-pager -n 50 || true
                exit 1
              fi
            "
