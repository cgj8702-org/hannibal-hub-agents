name: CI PR Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'dev/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.githooks/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

jobs:
  validate:
    name: Lint, Format, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Lint Check
        run: uv run ruff check

      - name: Run Ruff Format Check
        run: uv run ruff format --check

      - name: Run MyPy Static Type Check
        run: uv run mypy --show-error-codes

      - name: Run Unit Tests
        run: uv run pytest --tb=short -q
